# AI Knowledge Engine Manifatturiero — Fase 0 locale, single-tenant.
# Scheletro servizi (P0.2): backend, qdrant, ocr, ui.
# I servizi Python sono placeholder che restano "healthy" in attesa del codice
# dei Punti successivi (montato via volume ./src).

services:
  qdrant:
    image: qdrant/qdrant:v1.18.2
    container_name: aike_qdrant
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - aike_net
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: aike_backend
    depends_on:
      qdrant:
        condition: service_started
    env_file:
      - path: .env
        required: false
    volumes:
      - ./src:/app/src
    # Nessuna pubblicazione porte finche' e' placeholder: non serve HTTP e
    # occuperebbe host:8000 impedendo l'uvicorn locale. Riaggiungere "8000:8000"
    # quando il container servira' davvero il backend (deps nell'immagine).
    networks:
      - aike_net
    restart: unless-stopped

  ocr:
    build:
      context: .
      dockerfile: docker/ocr.Dockerfile
    container_name: aike_ocr
    depends_on:
      qdrant:
        condition: service_started
    env_file:
      - path: .env
        required: false
    volumes:
      - ./src:/app/src
      - ./corpus:/app/corpus
    networks:
      - aike_net
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: docker/ui.Dockerfile
    container_name: aike_ui
    depends_on:
      backend:
        condition: service_started
    env_file:
      - path: .env
        required: false
    volumes:
      - ./src:/app/src
    # Porta 8501 da riaggiungere quando la UI Streamlit servira' davvero (P5).
    networks:
      - aike_net
    restart: unless-stopped

networks:
  aike_net:
    driver: bridge

volumes:
  qdrant_storage:
