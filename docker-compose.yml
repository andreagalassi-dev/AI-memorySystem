# AI Knowledge Engine Manifatturiero — Fase 0 locale, single-tenant.
# Scheletro servizi (P0.2): backend, qdrant, ocr, ui.
# I servizi Python sono placeholder che restano "healthy" in attesa del codice
# dei Punti successivi (montato via volume ./src).

services:
  qdrant:
    image: qdrant/qdrant:v1.18.2
    container_name: aike_qdrant
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - aike_net
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: aike_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aike}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aike_dev}
      POSTGRES_DB: ${POSTGRES_DB:-aike_registry}
      # Fase 1.3 — ruolo SELECT-only per il ramo STRUCTURED (difesa in profondita').
      POSTGRES_RO_USER: ${POSTGRES_RO_USER:-aike_ro}
      POSTGRES_RO_PASSWORD: ${POSTGRES_RO_PASSWORD:-aike_ro_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_storage:/var/lib/postgresql/data
      # Init script (SOLO su volume vuoto): crea il ruolo read-only alla nascita.
      - ./docker/init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-aike} -d $${POSTGRES_DB:-aike_registry}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - aike_net
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: aike_backend
    depends_on:
      qdrant:
        condition: service_started
    env_file:
      - path: .env
        required: false
    volumes:
      - ./src:/app/src
    # Nessuna pubblicazione porte finche' e' placeholder: non serve HTTP e
    # occuperebbe host:8000 impedendo l'uvicorn locale. Riaggiungere "8000:8000"
    # quando il container servira' davvero il backend (deps nell'immagine).
    networks:
      - aike_net
    restart: unless-stopped

  ocr:
    # placeholder, vedi epica G/deploy
    profiles: ["placeholder"]
    build:
      context: .
      dockerfile: docker/ocr.Dockerfile
    container_name: aike_ocr
    depends_on:
      qdrant:
        condition: service_started
    env_file:
      - path: .env
        required: false
    volumes:
      - ./src:/app/src
      - ./corpus:/app/corpus
    networks:
      - aike_net
    restart: unless-stopped

  ui:
    # placeholder, vedi epica G/deploy
    profiles: ["placeholder"]
    build:
      context: .
      dockerfile: docker/ui.Dockerfile
    container_name: aike_ui
    depends_on:
      backend:
        condition: service_started
    env_file:
      - path: .env
        required: false
    volumes:
      - ./src:/app/src
    # Porta 8501 da riaggiungere quando la UI Streamlit servira' davvero (P5).
    networks:
      - aike_net

  watchdog:
    build:
      context: .
      dockerfile: docker/watchdog.Dockerfile
    depends_on:
      qdrant:
        condition: service_started
      postgres:
        condition: service_healthy
    volumes:
      - ./corpus:/corpus:ro
      - ./src:/app/src:ro
      - ./config:/app/config:ro
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - POSTGRES_DSN=${POSTGRES_DSN:-postgresql://aike:aike_dev@postgres:5432/aike_registry}
      - WATCHDOG_CORPUS_PATH=/corpus
      - WATCHDOG_DEFAULT_ROLE=tecnico
      - WATCHDOG_SCAN_INTERVAL_SECS=300
    ports:
      - "8001:8001"
    networks:
      - aike_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  searxng:
    # Epica H — ricerca online. Metamotore auto-ospitato: nessuna API a pagamento,
    # nessuna chiave nel repo, nessun endpoint di terzi che puo' bloccarci.
    #
    # OPZIONALE PER COSTRUZIONE: sta dietro il profilo "web", quindi un normale
    # `docker compose up` NON lo avvia. Installazione air-gapped = servizio assente
    # = il ramo web resta spento e il sistema si comporta ESATTAMENTE come prima
    # (l'adapter fallisce chiuso, non inventa). Per accenderlo:
    #     SEARXNG_SECRET=... docker compose --profile web up -d searxng
    # Per spegnerlo:  docker compose stop searxng && docker compose rm -f searxng
    # ATTENZIONE, INCIDENTE REALE: `docker compose --profile web down` NON
    # spegne solo questo — abbatte TUTTO il progetto. Eseguito per errore il
    # 24/08 ha rimosso postgres e qdrant e interrotto un'ingestion in corso.
    # I named volume hanno salvato i dati a riposo (169567 righe e 21 collezioni
    # ritrovate intatte), ma una scrittura IN VOLO si perde lo stesso.
    # REGOLA: sui comandi docker nomina SEMPRE il servizio. postgres e qdrant
    # sono infrastruttura condivisa fra piu' agenti/sessioni: mai `down`,
    # `up -d` o `restart` nudi.
    profiles: ["web"]
    image: searxng/searxng:2026.8.22-9fea41204
    container_name: aike_searxng
    environment:
      # Il segreto arriva dall'ambiente (.env non committato), MAI dal file di
      # configurazione montato: SearXNG lo mappa su server.secret_key.
      SEARXNG_SECRET: ${SEARXNG_SECRET:-}
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-http://localhost:8888/}
    ports:
      # Solo loopback: l'istanza non e' esposta fuori dalla macchina.
      - "127.0.0.1:8888:8080"
    volumes:
      # Read-only: la configurazione e' del repo, il container non la riscrive.
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - aike_net
    restart: unless-stopped

networks:
  aike_net:
    driver: bridge

volumes:
  qdrant_storage:
  # Named volume esplicito: i dati del registro sopravvivono a stop/rm del container.
  postgres_storage:
