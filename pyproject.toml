[project]
name = "ai-knowledge-engine"
version = "0.0.0"
description = "RAG ibrido verticale per il manifatturiero — Fase 0 locale, single-tenant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "qdrant-client>=1.18,<2.0",
    "fastembed>=0.8,<0.9",
    "pymupdf>=1.24",
    "FlagEmbedding>=1.4,<2.0",
    "ollama>=0.2",
    "streamlit>=1.33",
    "langgraph>=1.2.7",
    "psycopg[binary]>=3.2,<4.0",
    "instructor>=1.15.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
# Apple Silicon: adapter MLX per Gemma 4 (Fase 1 BLOCCO 1). Lazy-importato nel
# runtime reale; non richiesto per i test di invarianti (che usano FakeModelRuntime).
mlx = [
    "mlx-lm>=0.22",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "needs_mlx: richiede il vero adapter MLX e il download dei pesi (run con RUN_MLX=1)"
]

[tool.ruff]
line-length = 100
target-version = "py311"
